repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy .
        language: system
        types: [python]
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        require_serial: true